
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniSwap - Home</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F5F7FA;
}

.phone {
    width: 390px;
    height: 844px;
    background: white;
    margin: 30px auto;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
}

.header {
    padding: 20px;
    background: #2E3A8C;
    color: white;
    text-align: center;
    font-weight: 600;
    font-size: 20px;
}

.content {
    padding: 20px;
    flex: 1;
    overflow-y: auto;
}

/* SEARCH BAR */
.search-container {
    position: relative;
    margin-bottom: 25px;
}

.search-container i {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: #9CA3AF;
}

.search-container input {
    width: 100%;
    height: 46px;
    padding-left: 42px;
    padding-right: 14px;
    border-radius: 14px;
    border: 1px solid #E5E7EB;
    font-size: 14px;
}

/* Faculty Grid */
.faculty-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
}

.faculty-card {
    padding: 20px;
    background: #EEF2FF;
    border-radius: 14px;
    text-align: center;
    font-weight: 600;
    color: #2E3A8C;
}

/* Listing Card */
.card {
    background: white;
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    margin-bottom: 20px;
    transition: transform 0.2s ease;
}

.card:hover {
    transform: translateY(-4px);
}

.image-wrapper {
    position: relative;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 10px;
}

/* Condition Badge */
.condition-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    background: white;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Favourite Button */
.fav-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 36px;
    height: 36px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #F43F5E;
    cursor: pointer;
    transition: all 0.2s ease;
}

.fav-btn i {
    color: #F43F5E;
    font-size: 16px;
}

.fav-btn:hover {
    background: #F43F5E;
}

.fav-btn:hover i {
    color: white;
}

/* Verified Badge */
.badge {
    display: inline-block;
    background: #DCFCE7;
    color: #16A34A;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    margin-top: 5px;
}

/* NAV */
.nav {
    display: flex;
    justify-content: space-around;
    padding: 12px 0;
    border-top: 1px solid #eee;
    background: white;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    color: #888;
}

.nav-item i {
    font-size: 20px;
    margin-bottom: 4px;
}

.nav-item.active {
    color: #4F46E5;
    font-weight: 600;
}
</style>
</head>

<body>

<div class="phone">
    <div class="header">Home</div>

    <div class="content">

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search Module (e.g. INF3A)...">
        </div>

        <h4>Browse Faculties</h4>
        <div class="faculty-grid">
            <div class="faculty-card">Law</div>
            <div class="faculty-card">CompSci</div>
            <div class="faculty-card">Finance</div>
            <div class="faculty-card">Chemistry</div>
        </div>

        <h4>Recent Listings</h4>

        <!-- Listing 1 -->
        <div class="card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/400/300?random=1" alt="Book 1">
                <div class="condition-badge">Like New</div>
                <div class="fav-btn">
                    <i class="fa-regular fa-heart"></i>
                </div>
            </div>

            <strong>Modern Systems Analysis</strong>
            <p style="margin:4px 0;">INF3A · 9th Edition</p>
            <span class="badge">Verified Seller</span>
            <p style="margin-top:8px;"><strong>R 550</strong></p>
        </div>

        <!-- Listing 2 -->
        <div class="card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/400/300?random=2" alt="Book 2">
                <div class="condition-badge">Good</div>
                <div class="fav-btn">
                    <i class="fa-regular fa-heart"></i>
                </div>
            </div>

            <strong>Financial Accounting Principles</strong>
            <p style="margin:4px 0;">FIN2B · 6th Edition</p>
            <span class="badge">Verified Seller</span>
            <p style="margin-top:8px;"><strong>R 420</strong></p>
        </div>

    </div>

    <div class="nav">
        <div class="nav-item active">
            <i class="fa-solid fa-house"></i>
            Home
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-plus-circle"></i>
            Sell
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-comment-dots"></i>
            Chats
        </div>
        <div class="nav-item">
            <i class="fa-solid fa-user"></i>
            Profile
        </div>
    </div>
</div>

</body>
</html>
